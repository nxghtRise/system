name: Build System mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          sdk: v4.10.2

      - uses: actions/upload-artifact@v4
        with:
          name: system-mod
          path: ./build/*.geode
