name: Build System mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          sdk: v4.10.2
          bindings-ref: 5129d7d6dc7a1b7d6770a8a422e1b5266bed704e
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF
      - uses: actions/upload-artifact@v4
        with:
          name: system-mod
          path: ./build/*.geode
